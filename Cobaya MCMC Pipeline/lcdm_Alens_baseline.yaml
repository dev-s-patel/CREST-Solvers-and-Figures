packages_path: ./packages

theory:
  crest_theory.crest_theory:
    python_path: .
    extra_args:
      lens_potential_accuracy: 1

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite: null

params:
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.00015
    latex: \Omega_b h^2
  omch2:
    prior: {min: 0.09, max: 0.15}
    ref: 0.1200
    proposal: 0.0012
    latex: \Omega_c h^2
  H0:
    prior: {min: 60, max: 80}
    ref: 67.36
    proposal: 0.5
    latex: H_0
  tau:
    prior: {min: 0.03, max: 0.09}
    ref: 0.0544
    proposal: 0.004
    latex: \tau_{\mathrm{reio}}
  As:
    prior: {min: 1.5e-9, max: 2.7e-9}
    ref: 2.1e-9
    proposal: 3e-11
    latex: A_s
  ns:
    prior: {min: 0.92, max: 1.02}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  Alens:
    prior: {min: 0.5, max: 2.0}
    ref: 1.18
    proposal: 0.03
    latex: A_{\mathrm{L}}
  k_c: 0.35
  xi_reg: 0.0

sampler:
  mcmc:
    burn_in: 50
    covmat: auto
    max_tries: 50000
    Rminus1_stop: 0.03
    Rminus1_cl_stop: null

output: chains/lcdm_planck_Alens
