packages_path: ./packages

theory:
  crest_theory.crest_theory:
    python_path: .
    extra_args:
      lens_potential_accuracy: 1

likelihood:
  planck_2018_lowl.TT: null
  planck_2020_lollipop.lowlE: null
  planck_2020_hillipop.TTTEEE: null

params:
  ombh2:
    prior: {min: 0.019, max: 0.025}
    ref: 0.02237
    proposal: 0.00015
    latex: \Omega_b h^2
  omch2:
    prior: {min: 0.09, max: 0.15}
    ref: 0.1200
    proposal: 0.0012
    latex: \Omega_c h^2
  H0:
    prior: {min: 60, max: 80}
    ref: 67.36
    proposal: 0.5
    latex: H_0
  tau:
    prior: {min: 0.03, max: 0.09}
    ref: 0.0544
    proposal: 0.004
    latex: \tau_{\mathrm{reio}}
  As:
    prior: {min: 1.5e-9, max: 2.7e-9}
    ref: 2.1e-9
    proposal: 3e-11
    latex: A_s
  ns:
    prior: {min: 0.92, max: 1.02}
    ref: 0.9649
    proposal: 0.004
    latex: n_s
  Alens: 1.0
  k_c:
    prior: {min: 0.08, max: 0.80}
    ref: 0.35
    proposal: 0.03
    latex: k_c
  xi_reg:
    prior: {min: 0.0, max: 0.12}
    ref: 0.055
    proposal: 0.01
    latex: \xi_{\mathrm{reg}}

sampler:
  mcmc:
    burn_in: 50
    covmat: crest_planck.covmat
    max_tries: 50000
    Rminus1_stop: 0.03
    Rminus1_cl_stop: null

output: chains/crest_planck_PR4
